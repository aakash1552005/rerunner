name: Nightly Mutation Testing

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies and mutmut
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" mutmut

      - name: Run mutmut on security & integrity primitives
        run: |
          mutmut run \
            --paths-to-mutate=src/rerunner/integrity.py \
            --paths-to-mutate=src/rerunner/sanitizer.py \
            --runner="pytest -q tests/test_integrity.py tests/test_sanitizer.py" || true
          mutmut results

