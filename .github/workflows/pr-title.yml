name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          title = os.environ.get("PR_TITLE", "")
          pattern = re.compile(
              r"^(?:feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(?:\([a-z0-9._/-]+\))?!?: .+"
          )
          if not pattern.match(title):
              print(
                  f"ERROR: PR title must use Conventional Commits (e.g. feat(cli): add --json output), got: {title!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"OK: {title}")
          PY
