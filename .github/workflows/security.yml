name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Bandit SAST (AST Security Scanner)
        run: |
          bandit -r src/

      - name: Run pip-audit (Vulnerability Audit)
        run: |
          pip-audit
