[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rerunner"
version = "0.3.1"
description = "Deterministic flight recorder, replay engine, and CI test runner for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "AAKASH S S", email = "aakash1552005@gmail.com" },
]
keywords = [
    "pytest",
    "vcr",
    "llm",
    "agents",
    "replay",
    "testing",
    "httpx",
    "mocking",
    "side-effects",
    "cassette",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "zstandard>=0.22.0",
]


[project.urls]
Homepage = "https://github.com/aakash1552005/rerunner"
Documentation = "https://github.com/aakash1552005/rerunner#readme"
Repository = "https://github.com/aakash1552005/rerunner"
Issues = "https://github.com/aakash1552005/rerunner/issues"
Changelog = "https://github.com/aakash1552005/rerunner/releases"

[project.optional-dependencies]
zstd = [
    "zstandard>=0.22.0",
]
s3 = [
    "boto3>=1.34.0",
]
bedrock = [
    "boto3>=1.34.0",
]
azure = [
    "azure-storage-blob>=12.19.0",
]
gcs = [
    "google-cloud-storage>=2.14.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
openai = [
    "openai>=1.30.0",
]
anthropic = [
    "anthropic>=0.28.0",
]
google = [
    "google-genai>=0.1.0",
]
presidio = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
sether = [
    "sether>=0.4.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "zstandard>=0.22.0",
    "langchain-core>=0.2.0",
    "sether>=0.4.1",
]
all = [
    "zstandard>=0.22.0",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.14.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "langchain-core>=0.2.0",
]

[project.scripts]
rerunner = "rerunner.cli:app"

[project.entry-points.pytest11]
rerunner = "rerunner.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/rerunner"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = ["E501", "I001", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "rerunner: mark test to record or replay using a rerunner cassette",
    "asyncio: mark test as asyncio",
]
